<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Sistema Principal</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
   <link rel="stylesheet" href="./styles/index_style.css">
   <script type="module" src="./scripts/index.mjs"></script>
</head>

<body>
   <header id="menubar">
      <div class="mb-left">
         <button id="start-btn" class="mb-btn" title="Iniciar" aria-label="Menu iniciar"><i class="bi bi-command"></i></button>
         <strong id="app-name">Início</strong>
      </div>
      <span id="clock"></span>
   </header>

   <nav id="start-menu" class="hidden">
      <button class="menu-item" onclick="abrirTerminalModal()"><i class="bi bi-terminal"></i> Terminal</button>
      <button class="menu-item" onclick="abrirEditor()"><i class="bi bi-file-earmark-text"></i> Editor de texto</button>
      <button class="menu-item" onclick="abrirArquivos()"><i class="bi bi-folder"></i> Arquivos</button>
      <hr class="menu-sep">
      <button class="menu-item" data-power="off"><i class="bi bi-power"></i> Turn off</button>
      <button class="menu-item" data-power="reset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
   </nav>

   <!-- Área onde o gerenciador de janelas posiciona os apps -->
   <main id="workspace"></main>

   <footer id="dock-area">
      <nav id="dock">
         <button class="dock-btn" data-app="terminal" onclick="abrirTerminalModal()" title="Terminal">
            <span class="dock-icon ic-terminal"><i class="bi bi-terminal-fill"></i></span>
         </button>
         <button class="dock-btn" data-app="editor" onclick="abrirEditor()" title="Editor de texto">
            <span class="dock-icon ic-editor"><i class="bi bi-file-earmark-text-fill"></i></span>
         </button>
         <button class="dock-btn" data-app="files" onclick="abrirArquivos()" title="Arquivos">
            <span class="dock-icon ic-files"><i class="bi bi-folder-fill"></i></span>
         </button>
         <span class="dock-sep"></span>
         <button id="dock-power-btn" class="dock-btn" title="Energia" aria-label="Energia" aria-haspopup="true">
            <span class="dock-icon ic-power"><i class="bi bi-power"></i></span>
         </button>
      </nav>
   </footer>

   <div id="dock-power-menu" class="hidden">
      <button class="menu-item" data-power="off"><i class="bi bi-power"></i> Turn off</button>
      <button class="menu-item" data-power="reset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
   </div>

   <div id="power-off-screen" class="hidden">
      <i class="bi bi-power"></i>
      <p>Sistema desligado</p>
      <button id="power-on-btn" class="mac-btn primary">Ligar</button>
   </div>
</body>

</html>
